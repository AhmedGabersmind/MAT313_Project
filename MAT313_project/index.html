<!DOCTYPE html>
<html>
<head>
  <title>Newton-Raphson</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="box">
    <h1>Newton-Raphson Method</h1>
    <p>Use <b>x^n</b> for powers (example: <code>x^4-11x+8</code>)</p>

    <label>Function f(x): <input id="fnInput" value="x^4-11x+8" /></label>
    <label>Initial guess (x₀): <input type="number" id="x0Input" value="2" step="any" /></label>

    <button onclick="calculate()">Calculate</button>
    <button class="yellow" onclick="checkGuess()">Check the initial guess</button>

    <p id="result"></p>

    <table>
      <tr><th>i</th><th>(xi)</th></tr>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
